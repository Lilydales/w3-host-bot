name: Build Windows exe

on:
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    tags: ['v*']            # also builds when a tag like v0.2.5 is pushed

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build exe and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Setup

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: w3-host-bot-windows
          path: target/release-assets/*/*

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release-assets/*/*
